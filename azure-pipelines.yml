trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Bash@3
    displayName: 'Install Databricks CLI'
    inputs:
      command: 'bash'
      workingDirectory: ''
      script: |
        pip install databricks-cli

  - task: Bash@3
    displayName: 'Configure Databricks CLI'
    inputs:
      command: 'bash'
      workingDirectory: ''
      script: |
        databricks configure --token $(DATABRICKS_TOKEN) --host https://$(DATABRICKS_WORKSPACE_URL)

  - task: Bash@3
    displayName: 'Deploy Notebooks to Databricks'
    inputs:
      command: 'bash'
      workingDirectory: ''
      script: |
        databricks workspace import_dir --overwrite $(System.DefaultWorkingDirectory)/batch_demo
    env:
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
      DATABRICKS_WORKSPACE_URL: $(DATABRICKS_WORKSPACE_URL)